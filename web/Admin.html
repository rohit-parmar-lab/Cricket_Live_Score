<!DOCTYPE html>
<html>
    <head>
        <title>Admin Login</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

            body {
                margin: 0;
                font-family: 'Roboto', sans-serif;
                background: linear-gradient(120deg, #2980b9, #6dd5fa);
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }
            .login-container {
                background: #fff;
                width: 360px;
                padding: 40px;
                border-radius: 15px;
                box-shadow: 0 15px 35px rgba(0,0,0,0.2);
                text-align: center;
                position: relative;
            }
            /*        .login-container::before {
                        content: "🔒";
                        font-size: 50px;
                        position: absolute;
                        top: -25px;
                        left: calc(50% - 25px);
                        background: #fff;
                        border-radius: 50%;
                        padding: 10px;
                        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
                    }*/
            h2 {
                margin-bottom: 30px;
                color: #333;
                font-weight: 700;
            }
            input[type="email"],
            input[type="password"] {
                width: 100%;
                padding: 12px;
                margin: 10px 0;
                border: 1px solid #ccc;
                border-radius: 8px;
                font-size: 14px;
                transition: 0.3s;
            }
            input[type="email"]:focus,
            input[type="password"]:focus {
                border-color: #2980b9;
                box-shadow: 0 0 5px #2980b9;
                outline: none;
            }
            input[type="submit"] {
                width: 100%;
                padding: 12px;
                margin-top: 15px;
                background: linear-gradient(45deg, #2980b9, #6dd5fa);
                border: none;
                color: white;
                font-weight: bold;
                font-size: 16px;
                border-radius: 8px;
                cursor: pointer;
                transition: 0.3s;
            }
            input[type="submit"]:hover {
                background: linear-gradient(45deg, #6dd5fa, #2980b9);
            }
        </style>
    </head>

    <body>

        <div class="login-container">
            <h2>Admin Login</h2>

            <form action="Admin_Login" method="post" onsubmit="return validateLogin()">
                <input type="email" name="email" placeholder="Enter Admin Email" required>
                <input type="password" name="pwd" placeholder="Enter Password" required>
                <p id="errorMsg" style="color:red; font-weight:bold;"></p>
                <input type="submit" value="Login">
            </form>
        </div>
        <script>
            // URL se error parameter check karega
            const params = new URLSearchParams(window.location.search);
            if (params.get("error") === "1") {
                document.getElementById("errorMsg").innerText = "Invalid Email or Password!";
            }

            // Optional: Client-side validation
            function validateLogin() {
                const email = document.querySelector("input[name='email']").value;
                const pwd = document.querySelector("input[name='pwd']").value;

                if (email.trim() === "" || pwd.trim() === "") {
                    document.getElementById("errorMsg").innerText = "All fields are required!";
                    return false;  // Submit nahi hoga
                }

                return true; // Submit hoga
            }
        </script>
    </body>
</html>
